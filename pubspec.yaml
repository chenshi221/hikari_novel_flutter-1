name: hikari_novel_flutter
description: "An app for reading wenku8, refactor with flutter"

publish_to: 'none'

version: 0.10.0-beta.7+26

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 新框架（lib/next）：状态管理与路由
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # 网络
  dio: ^5.3.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  # 系统网络栈（安卓 Cronet / 苹果 NSURLSession），TLS 指纹和浏览器一致
  native_dio_adapter: ^1.8.0

  # 浏览器
  flutter_inappwebview: ^6.2.0-beta.3

  # 存储
  path: ^1.9.1
  path_provider: ^2.1.5
  hive_ce: ^2.11.1
  hive_ce_flutter: ^2.3.0

  # html解析
  html: ^0.15.4

  # url编码
  enough_convert: ^1.6.0

  # 包信息获取
  package_info_plus: ^10.2.1

  # 屏幕常亮
  wakelock_plus: ^1.8.0

  # 电量显示
  battery_plus: ^7.0.0

  # 文件选择器
  file_picker: ^13.0.0
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1

  # json序列化
  json_annotation: ^4.9.0

  # 调用外部浏览器
  url_launcher: ^6.3.2

  # tts
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.15

  # json序列化
  json_serializable: ^6.10.0

  # 启动图（dart run flutter_native_splash:create）
  flutter_native_splash: ^2.4.7

  # 设置应用图标
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/theme/

  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKaiLite.ttf
    - family: NotoSerifSCBundled
      fonts:
        - asset: assets/fonts/NotoSerifSC.otf

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo_transparent.png
  color_dark: "#121212"
  image_dark: assets/images/logo_transparent.png

  android_12:
    image: assets/images/logo_transparent.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/logo_transparent.png
    icon_background_color_dark: "#121212"

  web: false

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
